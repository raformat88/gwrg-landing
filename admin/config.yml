backend:
  name: github
  repo: raformat88/gwrg-landing
  branch: main
  base_url: http://192.168.1.138
  auth_endpoint: auth

media_folder: "assets/img"
public_folder: "/assets/img"

collections:
  - name: "landing"
    label: "📄 Главная страница (Весь контент)"
    files:
      - name: "home"
        label: "Контент всего сайта"
        file: "content.json"
        fields:
          - label: "Сайт (общее)"
            name: "site"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Название сайта", name: "name", widget: "string" }
              - { label: "Полное название", name: "full_name", widget: "string" }
              - { label: "Тег / слоган", name: "tagline", widget: "string" }
              - { label: "Описание (meta)", name: "description", widget: "text" }
              - { label: "Текст логотипа", name: "logo_text", widget: "string" }
              - { label: "Статус набора", name: "status", widget: "string" }

          - label: "Навигация"
            name: "nav"
            widget: "list"
            fields:
              - { label: "Текст ссылки", name: "label", widget: "string" }
              - { label: "URL / файл страницы", name: "href", widget: "string" }

          - label: "Главный экран (Hero)"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Подзаголовок", name: "subtitle", widget: "text" }
              - { label: "Текст основной кнопки", name: "button_text", widget: "string" }
              - { label: "Ссылка основной кнопки", name: "button_link", widget: "string" }
              - { label: "Текст второй кнопки", name: "secondary_text", widget: "string" }
              - { label: "Ссылка второй кнопки", name: "secondary_link", widget: "string" }
              - label: "Статистика"
                name: "stats"
                widget: "list"
                fields:
                  - { label: "Значение", name: "value", widget: "string" }
                  - { label: "Подпись", name: "label", widget: "string" }

          - label: "Преимущества"
            name: "benefits"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Заголовок секции", name: "title", widget: "string" }
              - { label: "Описание секции", name: "subtitle", widget: "text" }
              - label: "Карточки преимуществ"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Эмодзи / иконка", name: "icon", widget: "string" }
                  - { label: "Заголовок", name: "title", widget: "string" }
                  - { label: "Описание", name: "text", widget: "text" }

          - label: "Условия службы"
            name: "conditions"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Описание", name: "subtitle", widget: "text" }
              - { label: "Вступительный текст", name: "intro", widget: "text" }
              - label: "Карточки условий"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Код (18+, TECH...)", name: "code", widget: "string" }
                  - { label: "Заголовок", name: "title", widget: "string" }
                  - { label: "Описание", name: "text", widget: "text" }

          - label: "Этапы отбора"
            name: "stages"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Заголовок блока", name: "title", widget: "string" }
              - { label: "Описание блока", name: "subtitle", widget: "text" }
              - label: "Шаги"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "Номер", name: "number", widget: "string" }
                  - { label: "Название этапа", name: "title", widget: "string" }
                  - { label: "Описание этапа", name: "text", widget: "string" }

          - label: "Вакансии / Контракты"
            name: "vacancies"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Описание", name: "subtitle", widget: "text" }
              - label: "Фильтры (чипы)"
                name: "filters"
                widget: "list"
                field: { label: "Название фильтра", name: "item", widget: "string" }
              - label: "Список контрактов"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Название отряда", name: "unit", widget: "string" }
                  - { label: "Роль / платформа", name: "role", widget: "string" }
                  - { label: "Статус", name: "status", widget: "string" }
                  - { label: "Набор открыт?", name: "status_open", widget: "boolean", default: true }
                  - { label: "Требования", name: "requirements", widget: "string" }
                  - { label: "График", name: "schedule", widget: "string" }
                  - { label: "Текст кнопки", name: "button", widget: "string" }

          - label: "FAQ (Частые вопросы)"
            name: "faq"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Описание", name: "subtitle", widget: "text" }
              - label: "Вопросы"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Вопрос", name: "q", widget: "string" }
                  - { label: "Ответ", name: "a", widget: "text" }

          - label: "Контакты и форма заявки"
            name: "contacts"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Описание", name: "subtitle", widget: "text" }
              - label: "Каналы связи"
                name: "channels"
                widget: "list"
                fields:
                  - { label: "Платформа (discord/telegram/vk)", name: "platform", widget: "string" }
                  - { label: "Подпись", name: "label", widget: "string" }
                  - { label: "Адрес / значение", name: "value", widget: "string" }
                  - { label: "URL ссылки", name: "href", widget: "string" }
              - label: "Настройки формы"
                name: "form"
                widget: "object"
                collapsed: false
                fields:
                  - { label: "Заголовок формы", name: "title", widget: "string" }
                  - { label: "Подзаголовок формы", name: "desc", widget: "text" }
                  - { label: "Плейсхолдер позывного", name: "callsign_placeholder", widget: "string" }
                  - { label: "Подпись платформы", name: "platform_label", widget: "string" }
                  - label: "Список платформ"
                    name: "platforms"
                    widget: "list"
                    field: { label: "Платформа", name: "item", widget: "string" }
                  - { label: "Подпись специальности", name: "specialty_label", widget: "string" }
                  - label: "Список специальностей"
                    name: "specialties"
                    widget: "list"
                    field: { label: "Специальность", name: "item", widget: "string" }
                  - { label: "Плейсхолдер контакта", name: "contact_placeholder", widget: "string" }
                  - { label: "Плейсхолдер досье", name: "message_placeholder", widget: "string" }
                  - { label: "Текст чекбокса согласия", name: "consent_text", widget: "text" }
                  - { label: "Текст кнопки отправки", name: "submit_text", widget: "string" }
                  - { label: "Сообщение после отправки", name: "success_message", widget: "string" }

          - label: "Подвал (Footer)"
            name: "footer"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Название бренда", name: "brand", widget: "string" }
              - { label: "Подпись бренда", name: "brand_sub", widget: "string" }
              - label: "Ссылки в футере"
                name: "links"
                widget: "list"
                fields:
                  - { label: "Текст", name: "label", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
              - label: "Соцсети"
                name: "socials"
                widget: "list"
                fields:
                  - { label: "Название", name: "name", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
              - { label: "Дисклеймер", name: "disclaimer", widget: "text" }
              - { label: "Копирайт", name: "copyright", widget: "string" }
