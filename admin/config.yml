backend:
  name: github
  repo: raformat88/gwrg-landing
  branch: main
  base_url: http://192.168.1.138
  auth_endpoint: auth

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "pages"
    label: "Страницы"
    files:
      - label: "Главная страница (Лендинг)"
        name: "home"
        file: "content.json"
        fields:
          - { label: "Заголовок вкладки браузера", name: "title", widget: "string" }
          - { label: "Главный заголовок (Первый экран)", name: "hero_heading", widget: "string" }
          - { label: "Подзаголовок (Первый экран)", name: "hero_subtitle", widget: "text" }
          - { label: "Текст кнопки", name: "cta_text", widget: "string" }
          - { label: "Ссылка кнопки", name: "cta_link", widget: "string" }
          - { label: "Заголовок второго блока", name: "about_heading", widget: "string" }
          - { label: "Текст второго блока", name: "about_text", widget: "text" }
          - { label: "Контакты в подвале", name: "contacts_text", widget: "string" }
