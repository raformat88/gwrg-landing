backend:
  name: git-gateway
  branch: main

media_folder: "assets/img"
public_folder: "assets/img"

collections:
  - name: "landing"
    label: "Главная страница GWRG"
    files:
      - name: "home"
        label: "Контент главной страницы"
        file: "content.json"
        fields:
          - label: "SEO и метаданные"
            name: "meta"
            widget: "object"
            fields:
              - { label: "Заголовок страницы (Title)", name: "title", widget: "string" }
              - { label: "Описание (Description)", name: "description", widget: "text" }
              - { label: "Язык", name: "lang", widget: "string", default: "ru" }

          - label: "Шапка сайта (Header)"
            name: "header"
            widget: "object"
            fields:
              - { label: "Флаг (верхний левый)", name: "flag_image", widget: "image" }
              - { label: "Герб / Эмблема", name: "emblem_image", widget: "image" }
              - { label: "Название организации", name: "org_title", widget: "string" }
              - { label: "Подзаголовок", name: "org_subtitle", widget: "string" }
              - label: "Пункты меню"
                name: "nav"
                widget: "list"
                fields:
                  - { label: "Текст ссылки", name: "label", widget: "string" }
                  - { label: "URL / Якорь", name: "href", widget: "string" }
              - label: "Переключатель языка"
                name: "lang_switch"
                widget: "object"
                fields:
                  - { label: "Активный язык", name: "active", widget: "string" }
                  - { label: "Второй язык", name: "alt", widget: "string" }
                  - { label: "Ссылка второго языка", name: "alt_href", widget: "string" }
              - { label: "Текст кнопки в шапке", name: "cta_text", widget: "string" }
              - { label: "Ссылка кнопки в шапке", name: "cta_href", widget: "string" }

          - label: "Главный экран (Hero)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Фоновое изображение (1440x620)", name: "bg_image", widget: "image" }
              - { label: "Главный заголовок", name: "headline", widget: "string" }
              - { label: "Подзаголовок", name: "subheadline", widget: "text" }
              - label: "Основная кнопка"
                name: "primary_btn"
                widget: "object"
                fields:
                  - { label: "Текст", name: "text", widget: "string" }
                  - { label: "Ссылка", name: "href", widget: "string" }
              - label: "Вторая кнопка"
                name: "secondary_btn"
                widget: "object"
                fields:
                  - { label: "Текст", name: "text", widget: "string" }
                  - { label: "Ссылка", name: "href", widget: "string" }
              - label: "Счётчики под кнопками"
                name: "metrics"
                widget: "list"
                fields:
                  - { label: "Значение", name: "value", widget: "string" }
                  - { label: "Подпись", name: "label", widget: "string" }

          - label: "Условия службы"
            name: "conditions"
            widget: "object"
            fields:
              - { label: "Заголовок секции", name: "title", widget: "string" }
              - { label: "Подзаголовок", name: "subtitle", widget: "string" }
              - { label: "Фоновая карта", name: "bg_map_image", widget: "image" }
              - label: "Карточки условий"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Код", name: "code", widget: "string" }
                  - { label: "Штамп", name: "stamp", widget: "string" }
                  - { label: "Заголовок", name: "title", widget: "string" }
                  - { label: "Описание", name: "description", widget: "text" }
                  - { label: "Иконка", name: "icon", widget: "image" }

          - label: "Этапы отбора"
            name: "stages"
            widget: "object"
            fields:
              - { label: "Заголовок блока", name: "title", widget: "string" }
              - label: "Шаги"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "Номер", name: "number", widget: "string" }
                  - { label: "Название этапа", name: "title", widget: "string" }
                  - { label: "Описание", name: "detail", widget: "string" }

          - label: "Актуальные контракты"
            name: "contracts"
            widget: "object"
            fields:
              - { label: "Заголовок секции", name: "title", widget: "string" }
              - { label: "Подзаголовок", name: "subtitle", widget: "string" }
              - label: "Список контрактов"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Эмблема отряда", name: "unit_logo", widget: "image" }
                  - { label: "Текст статуса", name: "status", widget: "string" }
                  - { label: "Набор открыт?", name: "status_open", widget: "boolean", default: true }
                  - { label: "Название отряда", name: "unit_name", widget: "string" }
                  - { label: "Специальность и платформа", name: "role", widget: "string" }
                  - { label: "Требования", name: "requirements", widget: "string" }
                  - { label: "График активности", name: "schedule", widget: "string" }
                  - { label: "Текст кнопки", name: "cta_text", widget: "string" }
                  - { label: "Ссылка кнопки", name: "cta_href", widget: "string" }

          - label: "FAQ (Частые вопросы)"
            name: "faq"
            widget: "object"
            fields:
              - { label: "Заголовок секции", name: "title", widget: "string" }
              - label: "Вопросы и ответы"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Вопрос", name: "question", widget: "string" }
                  - { label: "Ответ", name: "answer", widget: "text" }

          - label: "Штаб-квартира и форма заявки"
            name: "contacts"
            widget: "object"
            fields:
              - { label: "Заголовок секции", name: "title", widget: "string" }
              - { label: "Подзаголовок", name: "subtitle", widget: "string" }
              - { label: "Заголовок колонки каналов", name: "channels_title", widget: "string" }
              - label: "Каналы связи"
                name: "channels"
                widget: "list"
                fields:
                  - { label: "Платформа (discord/telegram/vk)", name: "platform", widget: "string" }
                  - { label: "Подпись", name: "label", widget: "string" }
                  - { label: "Отображаемый адрес", name: "value", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
              - { label: "Изображение карты сектора (520x320)", name: "map_image", widget: "image" }
              - { label: "Подпись под картой", name: "map_caption", widget: "string" }
              - label: "Настройки формы"
                name: "form"
                widget: "object"
                fields:
                  - { label: "Заголовок формы", name: "title", widget: "string" }
                  - { label: "Плейсхолдер позывного", name: "callsign_placeholder", widget: "string" }
                  - { label: "Список платформ", name: "platforms", widget: "list", field: { label: "Платформа", name: "item", widget: "string" } }
                  - { label: "Список специальностей", name: "specialties", widget: "list", field: { label: "Специальность", name: "item", widget: "string" } }
                  - { label: "Плейсхолдер контакта", name: "contact_placeholder", widget: "string" }
                  - { label: "Плейсхолдер досье", name: "message_placeholder", widget: "string" }
                  - { label: "Текст чекбокса", name: "consent_text", widget: "text" }
                  - { label: "Текст кнопки отправки", name: "submit_text", widget: "string" }
                  - { label: "Сообщение после отправки", name: "success_message", widget: "string" }

          - label: "Подвал (Footer)"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Эмблема в футере", name: "emblem_image", widget: "image" }
              - { label: "Название", name: "brand_name", widget: "string" }
              - { label: "Подпись", name: "brand_sub", widget: "string" }
              - label: "Ссылки в футере"
                name: "links"
                widget: "list"
                fields:
                  - { label: "Текст", name: "label", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
              - label: "Соцсети"
                name: "socials"
                widget: "list"
                fields:
                  - { label: "Название", name: "name", widget: "string" }
                  - { label: "URL", name: "href", widget: "string" }
                  - { label: "Код иконки", name: "icon", widget: "string" }
              - { label: "Дисклеймер", name: "disclaimer", widget: "text" }
              - { label: "Копирайт", name: "copyright", widget: "string" }
